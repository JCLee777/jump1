name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag and release notes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag and changelog
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example v0.1.0)." >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match Cargo.toml version $package_version." >&2
            exit 1
          fi

          awk -v version="$tag_version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      - name: Verify localized release notes
        shell: bash
        run: |
          set -euo pipefail
          if ! awk '
            /^### 简体中文[[:space:]]*$/ { locale = "zh"; found_zh = 1; next }
            /^### English[[:space:]]*$/ { locale = "en"; found_en = 1; next }
            /^[[:space:]]*$/ { next }
            {
              if (locale == "zh") content_zh = 1
              if (locale == "en") content_en = 1
            }
            END { exit !(found_zh && found_en && content_zh && content_en) }
          ' "$RUNNER_TEMP/release-notes.md"; then
            echo "Release notes must contain non-empty Simplified Chinese and English sections." >&2
            exit 1
          fi

      - name: Save release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build Apple Silicon macOS package
    needs: validate
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin

      - name: Build ARM64 DMG
        run: CARGO_BUILD_TARGET=aarch64-apple-darwin ./scripts/package-macos.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/Jump1-*-aarch64.dmg
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows x86_64 package
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/Jump1-*-x86_64-windows.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [validate, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: dist

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist

      - name: Verify tag was not moved
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f 1)"
          if [[ -z "$remote_tag" ]]; then
            remote_tag="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | cut -f 1)"
          fi
          if [[ "$remote_tag" != "$GITHUB_SHA" ]]; then
            echo "The tag no longer points to this release commit; refusing to publish." >&2
            exit 1
          fi

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; published releases are immutable." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" dist/Jump1-* \
            --title "Jump1 $GITHUB_REF_NAME" \
            --notes-file release-notes/release-notes.md \
            --verify-tag

[package]
name = "jump1"
version = "0.1.23"
edition = "2024"
publish = false
description = "A fast, lightweight desktop launcher and utility toolkit built with Rust and GPUI."
license = "MIT"
readme = "README.md"
build = "build.rs"

[build-dependencies]
embed-resource = "=3.0.11"

[dependencies]
chrono = "=0.4.45"
data-url = "=0.3.2"
futures = "=0.3.34"
global-hotkey = "=0.8.0"
gpui-kit = {
  version = "=0.7.0",
  features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
  ],
}
image = {
  version = "=0.25.10",
  default-features = false,
  features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"],
}
pinyin = "=0.11.0"
reqwest = {
  package = "gpui-pre-reqwest",
  version = "=0.12.15",
  default-features = false,
  features = ["blocking", "json", "rustls-tls"],
}
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
similar = { version = "=3.2.0", default-features = false, features = ["text"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "=0.6.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
icns = "=0.5.0"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem", "NSWindow", "NSView", "NSButton", "NSEvent", "NSScreen", "libc"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGAffineTransform", "CGColorSpace", "CGContext", "CGGeometry", "CGImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageSource", "ImageIOBase", "objc2-core-graphics"] }
plist = "=1.10.1"
smappservice-rs = "=0.1.3"
roxmltree = "=0.21.1"
